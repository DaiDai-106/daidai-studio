workflow:
  auto_cancel:
    on_new_commit: none
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"'

stages: [release]

release_linux:
  image: node:22-bookworm
  stage: release
  resource_group: dai-studio-release
  variables:
    GIT_DEPTH: "0"
  script:
    - |
      set -euo pipefail
      test "$(uname -m)" = x86_64
      plan_dir=$(mktemp -d)
      trap 'rm -rf -- "$plan_dir"' EXIT
      plan="$plan_dir/release.json"

      git fetch --tags origin
      node --experimental-strip-types scripts/gitlab-release.ts prepare > "$plan"
      version=$(node -p 'const plan = require(process.argv[1]); plan.published ? "" : plan.version' "$plan")
      if [[ -z "$version" ]]; then
        echo 'This commit already has a GitLab Release.'
        exit 0
      fi

      apt-get update -qq
      apt-get install -y --no-install-recommends \
        dbus-x11 fakeroot libasound2 libgbm1 libgtk-3-0 libnotify4 libnss3 \
        libsecret-1-0 libxss1 libxtst6 xauth xvfb xz-utils

      # Electron tests use the unprivileged Node image user and the Chromium sandbox.
      chown -R node:node .
      runuser -u node -- npm version "$version" --no-git-tag-version --allow-same-version --ignore-scripts
      runuser -u node -- npm ci
      chown root:root node_modules/electron/dist/chrome-sandbox
      chmod 4755 node_modules/electron/dist/chrome-sandbox
      runuser -u node -- xvfb-run -a dbus-run-session -- npm run check

      # Reuse the tested build and keep the Debian version identical to the release tag.
      runuser -u node -- env -u CI_PIPELINE_IID node --experimental-strip-types electron.package.ts --deb
      deb="release/dai-studio_${version}_amd64.deb"
      test "$(dpkg-deb -f "$deb" Package)" = dai-studio
      test "$(dpkg-deb -f "$deb" Architecture)" = amd64
      test "$(dpkg-deb -f "$deb" Version)" = "$version"
      runuser -u node -- xvfb-run -a dbus-run-session -- node tests/integration/package_smoke.mjs release/linux-unpacked/dai-studio
      node --experimental-strip-types scripts/gitlab-release.ts publish "$plan" "$deb"

