name: Desktop CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            target: --deb
            artifact: dai-studio-linux-amd64
            extension: deb
          - name: Windows x64
            runner: windows-2025
            target: --win
            artifact: dai-studio-windows-x64
            extension: exe
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Validate release metadata
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: node --experimental-strip-types scripts/github-release.ts --check
      - name: Build and package
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
          CHECK_PACKAGED_APP: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 'true' || 'false' }}
        run: bash scripts/github-build.sh "$PACKAGE_TARGET"
      - name: Run headless checks
        if: matrix.target == '--deb'
        run: |
          npm run lint
          node tests/runners/test_runner.mjs 'tests/{backend,contracts,desktop,renderer,shared,support}/**/*.test.ts'
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release/*.${{ matrix.extension }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  macos-release:
    name: macOS Apple Silicon
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Validate release metadata
        run: node --experimental-strip-types scripts/github-release.ts --check
      - name: Build app
        run: |
          npm ci
          npm run build:package
      - name: Sign and verify macOS installer
        id: dmg
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          : "${CSC_LINK:?Missing signing certificate}" "${CSC_KEY_PASSWORD:?Missing certificate password}"

          work_dir=$(mktemp -d "$RUNNER_TEMP/dai-studio-dmg.XXXXXX")
          trap 'rm -rf -- "$work_dir"' EXIT

          node node_modules/electron-builder/cli.js --mac dmg --arm64 --publish never \
            --config electron-builder.json --config.directories.output="$work_dir/output"
          unset CSC_LINK CSC_KEY_PASSWORD

          shopt -s nullglob
          set -- "$work_dir"/output/*.dmg
          if [[ "$#" != 1 ]]; then
            printf 'Expected one macOS installer, found %s\n' "$#" >&2
            exit 1
          fi

          image=$1
          codesign --verify --strict "$image"

          mount_dir="$work_dir/mount"
          mkdir "$mount_dir"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$image"
          trap 'hdiutil detach "$mount_dir" && rm -rf -- "$work_dir"' EXIT
          app="$mount_dir/Dai Studio.app"
          codesign --verify --deep --strict "$app"
          libraries=("$app/Contents/Frameworks"/libTK*.dylib)
          test "${#libraries[@]}" -gt 0
          codesign --verify --strict "$app/Contents/MacOS/cad-import" "${libraries[@]}"
          node tests/integration/package_smoke.mjs "$app/Contents/MacOS/Dai Studio"
          hdiutil detach "$mount_dir"
          trap 'rm -rf -- "$work_dir"' EXIT

          mkdir -p release
          mv "$image" release/
          printf 'filename=%s\n' "${image##*/}" >> "$GITHUB_OUTPUT"
      - name: Notarize macOS installer
        env:
          IMAGE: release/${{ steps.dmg.outputs.filename }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          : "${APPLE_ID:?Missing Apple ID}" "${APPLE_APP_SPECIFIC_PASSWORD:?Missing app password}" "${APPLE_TEAM_ID:?Missing Apple team ID}"

          if ! submission=$(xcrun notarytool submit "$IMAGE" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --output-format json); then
            printf '%s\n' "$submission" >&2
            exit 1
          fi

          printf '%s\n' "$submission"
          status=$(node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).status' <<< "$submission")
          if [[ "$status" != Accepted ]]; then
            printf 'Apple notarization did not succeed: %s\n' "$status" >&2
            exit 1
          fi

          xcrun stapler staple "$IMAGE"
          xcrun stapler validate "$IMAGE"
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: dai-studio-macos-arm64
          path: release/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, macos-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency: desktop-release-${{ github.ref }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: dai-studio-*
          path: installers
          merge-multiple: true
      - name: Publish release with all three installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/github-release.ts
