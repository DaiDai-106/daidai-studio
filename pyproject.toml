[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "daidai-pi"
version = "0.0.0"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["ruff==0.16.0"]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
